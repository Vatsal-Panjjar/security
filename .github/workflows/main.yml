name: Main Deployment

on:
  push:
    branches: 
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get ACR Name
        id: acr
        run: |
          ACR_NAME=$(az acr list --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT

      - name: ACR Login
        run: |
          az acr login --name ${{ steps.acr.outputs.acr_name }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.acr.outputs.acr_name }}.azurecr.io/python-app:${{ github.sha }} \
            -f Python-Dockerfile/Dockerfile \
            Python-Dockerfile

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.acr.outputs.acr_name }}.azurecr.io/python-app:${{ github.sha }}

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.acr.outputs.acr_name }}.azurecr.io/python-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
